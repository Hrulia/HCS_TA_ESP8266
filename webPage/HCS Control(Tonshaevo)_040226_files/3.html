    <script type="text/javascript">
    
    $(document).ready(async function() {
      const title_height = 16;
      const reverse_axis_left = 15;
      const margin = {top: 10, right: 20, bottom: 60, left: 70},
            width = $('#chart-container').width() - margin.left - margin.right,
            height = $('#chart-container').height() - margin.top - margin.bottom - title_height; 
      const columnWidthRatio = 0.9;
      const barWidthRatio = 0.85;
      const splineTension = 0.8;
      const minBarColumnWidth = 1;
      const maxBarColumnWidth = 10;
      const tickValueThreshold = 1e24;
      const tickValueThresholdMinus = -1e24;
      const tickValueThresholdSmall = 10;
      const tickValueThresholdSmallMinus = -10;
      let last_date;
    
      // add rectangle for chart
      const svg = d3.select("#chart-container").append("svg")
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom + title_height)
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top + title_height})` );
      
      // the url to fetch data
      const dataUrl = 'https://thingspeak.mathworks.com/channels/1627034/field/3.json?&amp;offset=0&amp;results=80';
      try {
        const response = await d3.json(dataUrl);
        if (response == '-1') {
            $('#chart-container').append('This channel is not public.  To embed charts, the channel must be public or a read key must be specified.');
          }
        const responsedata=response.feeds;
        let data = responsedata
          .filter(d => {
            const value = parseFloat(d.field3);
            return !isNaN(value) && isFinite(value)
                            ;
          })
          .map(d => ({
            date: Date.parse(d.created_at),
            value: parseFloat(d.field3)
          }));

          svg.append('text')
            .attr('x', width / 2) 
            .attr('y', -title_height / 4) 
            .attr("class", "chart-title")
            .text(decodeURIComponent('%D0%9F%D0%BE%D0%B4%D0%B0%D1%87%D0%B0%20%D1%81%D0%B8%D1%81%D1%82%D0%B5%D0%BC%D0%B0'));
        // title

        let x;
        let y;

        function getTimeRange(data) {
          const startTime = d3.min(data, d => d.date);
          const endTime = d3.max(data, d => d.date);
          return endTime - startTime;
        }
        function customTickFormat(date, timeRange) {
          // This function determines the tick format based on 
          // the overall time distribution of the data.
          // if the total time range is within 5 minutes, using %H:%M:%S like 10:11:20
          // if the time range is within 15 days, using %H:%M like 11:25
          // Otherwise it only contains date information.
          // And for the mid night time tick, it will only show the date information as well

          const formatSecond = d3.timeFormat("%H:%M:%S");
          const formatMinute = d3.timeFormat("%H:%M");
          const formatDate = d3.timeFormat("%d %b");
          
          if (date.getHours() === 0 && date.getMinutes() === 0) {
            return formatDate(date);
          } else if (timeRange <= 5 * 60 * 1000) { 
            return formatSecond(date); // less than 5 minutes, using %H:%M:%S
          } else if (timeRange <= 15 * 24 * 60 * 60 * 1000) { 
            return formatMinute(date); // less than 15 days, using %H:%M
          } else {
            return formatDate(date);
          }
        }

        function tickValueTwoSignificantFigures(d){
          const dStr = d.toExponential();
          const [base, exponent] = dStr.split('e');
          const significantDigits = base.replace(/[^0-9]/g, '').slice(0, 3).padEnd(3, '0');              
          const roundedValue = Math.round(parseInt(significantDigits) / 10);              
          const result = roundedValue.toString().padEnd(2, '0');
          return result;
        }
        function customValueTickFormat(d) {
          // When the tick label's number is greater than 1e24 or less than -1e24
          // only the highest two significant digits are retained, 
          // followed by an "E" at the end. 
          // when the number is between -10 to 10, the tick format will be d3.format(".2f")
          // otherwise, it would be d3.format(".3s")
          // for example:
          // 2.82111 -> 2.82
          // 200000 -> 200k
          // 3e+125 -> 3.0E
          switch (true) {
            case (d >= tickValueThreshold):
              {
                const result = tickValueTwoSignificantFigures(d);
                return `${result[0]}.${result[1]}E`;
              }
            case (d <= tickValueThresholdMinus):
              {
                const result = tickValueTwoSignificantFigures(d);
                return `-${result[0]}.${result[1]}E`;
              }
            case (d > tickValueThresholdSmallMinus && d < tickValueThresholdSmall):
              return d3.format(".2f")(d);
            default:
              return d3.format(".3s")(d);
          }
        }

        function parseD3FormattedNumber(formattedStr) {
          // The function is used to perform the inverse operation to retrieve numeric values from strings output by D3.js.
          // for example:
          // 1.02k -> 1020
          // 1.31M -> 1310000
          const units = {
              '': 1,
              'k': 1e3,
              'M': 1e6,
              'G': 1e9,
              'T': 1e12,
              'P': 1e15,
              'E': 1e18,
              'Z': 1e21,
              'Y': 1e24
          };
          const regex = /^([-+]?[0-9]*\.?[0-9]+)([a-zA-Z]?)$/; 
          const match = formattedStr.match(regex);

          const numberPart = parseFloat(match[1]);
          const unit = match[2];
          return numberPart * units[unit];
          
        }

        function setLineAndColumnYTicks(y){
          const [minYDomain, maxYDomain] = y.domain();
          let yTicks = y.ticks(5, "s");
          let tickPairs = yTicks.map(d => ({ original: d, formatted: customValueTickFormat(d).replace('−', '-') }));
          let uniqueTickPairsMap = new Map();
          tickPairs.forEach(pair => {
              if (!uniqueTickPairsMap.has(pair.formatted)) {
                  uniqueTickPairsMap.set(pair.formatted, pair.original);
              }
          });

          let uniqueTicksSurplus = Array.from(uniqueTickPairsMap.entries())
            .filter(([formatted, original]) => original >= tickValueThreshold || original <= tickValueThresholdMinus)
            .map(([formatted, original]) => original);
          
          let uniqueTicksMinimum = Array.from(uniqueTickPairsMap.entries())
            .filter(([formatted, original]) => original >= tickValueThresholdSmallMinus && original <= tickValueThresholdSmall)
            .map(([formatted, original]) => Number(formatted));

          let uniqueTicksMid = Array.from(uniqueTickPairsMap.entries())
            .filter(([formatted, original]) => (original > tickValueThresholdSmall && original < tickValueThreshold) || (original < tickValueThresholdSmallMinus && original > tickValueThresholdMinus))
            .map(([formatted, original]) => parseD3FormattedNumber(formatted));

          let uniqueTicks = uniqueTicksSurplus.concat(uniqueTicksMinimum).concat(uniqueTicksMid).sort((a, b) => a - b);
          let uniqueTicksInRange = uniqueTicks.filter(d => d>=minYDomain && d<=maxYDomain);
          let yTicksText;
          if(uniqueTicksInRange.length!==0){
            uniqueTicksInRange.forEach(function(tickValue) {
              svg.append("line") 
                .attr("class", "tick-line")
                .attr("y1", y(tickValue)) 
                .attr("x1", 0) 
                .attr("y2", y(tickValue)) 
                .attr("x2", width) 
                .attr("stroke", "#e0e0e0") 
                .attr("stroke-width", 1)
                .lower(); 
            });
            yTicksText = d3.axisLeft(y)
              .tickValues(uniqueTicksInRange) 
              .tickFormat(d => customValueTickFormat(d)); 
          } else {
            if(uniqueTicks.length===0){
              // there is no tick, which always happen with empty data
              yTicksText = d3.axisLeft(y)
                .tickValues([]);
              return yTicksText;
            }
            // all ticks are not in the range, put the tick on the upper/lower bound
            if(uniqueTicks[0]>=maxYDomain){
              // all ticks are greater than the range, add only one line at the top
              svg.append("line") 
                .attr("class", "tick-line")
                .attr("y1", y(maxYDomain)) 
                .attr("x1", 0) 
                .attr("y2", y(maxYDomain)) 
                .attr("x2", width) 
                .attr("stroke", "#e0e0e0") 
                .attr("stroke-width", 1)
                .lower(); 
              yTicksText = d3.axisLeft(y)
                .tickValues([maxYDomain]) 
                .tickFormat(d => customValueTickFormat(uniqueTicks[0])); 
            } else if(uniqueTicks[uniqueTicks.length-1]<=minYDomain){
              // all ticks are less than the range, add only one line at the bottom
              svg.append("line") 
                .attr("class", "tick-line")
                .attr("y1", y(minYDomain)) 
                .attr("x1", 0) 
                .attr("y2", y(minYDomain)) 
                .attr("x2", width) 
                .attr("stroke", "#e0e0e0") 
                .attr("stroke-width", 1)
                .lower(); 
              yTicksText = d3.axisLeft(y)
                .tickValues([minYDomain]) 
                .tickFormat(d => customValueTickFormat(uniqueTicks[uniqueTicks.length-1])); 
            } else {
              // uniqueTicksInRange[0] is smaller than minYDomain
              // and uniqueTicksInRange[uniqueTicksInRange.length-1] is larger than maxYDomain
              // add 2 lines, one at the bottom and the other is on the top
              svg.append("line") 
                .attr("class", "tick-line")
                .attr("y1", y(minYDomain)) 
                .attr("x1", 0) 
                .attr("y2", y(minYDomain)) 
                .attr("x2", width) 
                .attr("stroke", "#e0e0e0") 
                .attr("stroke-width", 1)
                .lower();
              svg.append("line") 
                .attr("class", "tick-line")
                .attr("y1", y(maxYDomain)) 
                .attr("x1", 0) 
                .attr("y2", y(maxYDomain)) 
                .attr("x2", width) 
                .attr("stroke", "#e0e0e0") 
                .attr("stroke-width", 1)
                .lower(); 
              yTicksText = d3.axisLeft(y)
                .tickValues([minYDomain, maxYDomain]) 
                .tickFormat(d => {
                    if (d === minYDomain) return customValueTickFormat(uniqueTicks[0]);
                    if (d === maxYDomain) return customValueTickFormat(uniqueTicks[uniqueTicks.length-1]);
                    return d; 
                }); 
            }        
          }
          return yTicksText;
        }

        function setBarXTicks(x){
          const [minXDomain, maxXDomain] = x.domain();
          let xTicks = x.ticks(5, "s");
          let tickPairs = xTicks.map(d => ({ original: d, formatted: customValueTickFormat(d).replace('−', '-') }));
          
          let uniqueTickPairsMap = new Map();
          tickPairs.forEach(pair => {
              if (!uniqueTickPairsMap.has(pair.formatted)) {
                  uniqueTickPairsMap.set(pair.formatted, pair.original);
              }
          });

          let uniqueTicksSurplus = Array.from(uniqueTickPairsMap.entries())
            .filter(([formatted, original]) => original >= tickValueThreshold || original <= tickValueThresholdMinus)
            .map(([formatted, original]) => original);
          
          let uniqueTicksMinimum = Array.from(uniqueTickPairsMap.entries())
            .filter(([formatted, original]) => original >= tickValueThresholdSmallMinus && original <= tickValueThresholdSmall)
            .map(([formatted, original]) => Number(formatted));

          let uniqueTicksMid = Array.from(uniqueTickPairsMap.entries())
            .filter(([formatted, original]) => (original > tickValueThresholdSmall && original < tickValueThreshold) || (original < tickValueThresholdSmallMinus && original > tickValueThresholdMinus))
            .map(([formatted, original]) => parseD3FormattedNumber(formatted));

          let uniqueTicks = uniqueTicksSurplus.concat(uniqueTicksMinimum).concat(uniqueTicksMid).sort((a, b) => a - b);
          let uniqueTicksInRange = uniqueTicks.filter(d => d>=minXDomain && d<=maxXDomain);
          let xTicksText;
          if(uniqueTicksInRange.length!==0){
            uniqueTicksInRange.forEach(function(tickValue) {
              svg.append("line") 
                .attr("class", "tick-line")
                .attr("y1", title_height) 
                .attr("x1", x(tickValue)) 
                .attr("y2", height) 
                .attr("x2", x(tickValue)) 
                .attr("stroke", "#e0e0e0") 
                .attr("stroke-width", 1)
                .attr("transform", `translate(5,0)`) 
                .lower(); 
            });
            xTicksText = d3.axisBottom(x)
              .tickValues(uniqueTicksInRange) 
              .tickFormat(d => customValueTickFormat(d)); 
          } else {
            if(uniqueTicks.length===0){
              // there is no tick, which always happen with empty data
              xTicksText = d3.axisBottom(x)
                .tickValues([]);
              return xTicksText;
            }
            // all ticks are not in the range, put the tick on the upper/lower bound
            if(uniqueTicks[0]>=maxXDomain){
              // all ticks are greater than the range, add only one line at the top
              svg.append("line") 
                .attr("class", "tick-line")
                .attr("y1", title_height) 
                .attr("x1", x(maxXDomain)) 
                .attr("y2", height) 
                .attr("x2", x(maxXDomain)) 
                .attr("stroke", "#e0e0e0") 
                .attr("stroke-width", 1)
                .attr("transform", `translate(5,0)`) 
                .lower(); 
              xTicksText = d3.axisBottom(x)
                .tickValues([maxXDomain]) 
                .tickFormat(d => customValueTickFormat(uniqueTicks[0])); 
            } else if(uniqueTicks[uniqueTicks.length-1]<=minXDomain){
              // all ticks are less than the range, add only one line at the bottom
              svg.append("line") 
                .attr("class", "tick-line")
                .attr("y1", title_height) 
                .attr("x1", x(minXDomain)) 
                .attr("y2", height) 
                .attr("x2", x(minXDomain)) 
                .attr("stroke", "#e0e0e0") 
                .attr("stroke-width", 1)
                .attr("transform", `translate(5,0)`) 
                .lower(); 
              xTicksText = d3.axisBottom(x)
                .tickValues([minXDomain]) 
                .tickFormat(d => customValueTickFormat(uniqueTicks[uniqueTicks.length-1])); 
            } else {
              // uniqueTicksInRange[0] is smaller than minYDomain
              // and uniqueTicksInRange[uniqueTicksInRange.length-1] is larger than maxYDomain
              // add 2 lines, one at the bottom and the other is on the top
              svg.append("line") 
                .attr("class", "tick-line")
                .attr("y1", title_height) 
                .attr("x1", x(minXDomain)) 
                .attr("y2", height) 
                .attr("x2", x(minXDomain)) 
                .attr("stroke", "#e0e0e0") 
                .attr("stroke-width", 1)
                .attr("transform", `translate(5,0)`) 
                .lower();
              svg.append("line") 
                .attr("class", "tick-line")
                .attr("y1", title_height) 
                .attr("x1", x(maxXDomain)) 
                .attr("y2", height) 
                .attr("x2", x(maxXDomain)) 
                .attr("stroke", "#e0e0e0") 
                .attr("stroke-width", 1)
                .attr("transform", `translate(5,0)`) 
                .lower(); 
              xTicksText = d3.axisBottom(x)
                .tickValues([minXDomain, maxXDomain]) 
                .tickFormat(d => {
                    if (d === minXDomain) return customValueTickFormat(uniqueTicks[0]);
                    if (d === maxXDomain) return customValueTickFormat(uniqueTicks[uniqueTicks.length-1]);
                    return d; 
                }); 
            }        
          }
          return xTicksText;
        }
        function setLineAxis(data){
          const timeRange = getTimeRange(data);
          x = d3.scaleTime()
          .domain(d3.extent(data, d => d.date))
          .range([0, width]);

          svg.append("g")
            .attr("transform", `translate(0,${height})`)
            .attr("class", "x-axis")
            .call(d3.axisBottom(x).ticks(4).tickFormat(d => customTickFormat(d, timeRange)).tickSizeOuter(0))
            .call(g => g.selectAll(".domain, .tick").classed("chart-x-axis-label", true))
            .lower()
          .append("text")
            .attr("y", margin.bottom *2 / 3)
            .attr("x", width / 2)
            .attr("class", "chart-xaxis")
            .text(decodeURIComponent('%D0%92%D1%80%D0%B5%D0%BC%D1%8F%2C%20%D1%87'));
          // x axis

          const dataExtent = d3.extent(data, d => d.value);
          const yminValue = dataExtent[0] - 0.05*(dataExtent[1]-dataExtent[0]);
          const ymaxValue = dataExtent[1] + 0.05*(dataExtent[1]-dataExtent[0]);

          y = d3.scaleLinear()
            .domain([25,60 ])
            .range([height, 0]);
          const yTicksText = setLineAndColumnYTicks(y);
      
          svg.append("g")
            .attr("class", "y-axis")
            .call(yTicksText)
            .call(g => g.selectAll(".domain, .tick line").remove())
            .call(g => g.selectAll(".domain, .tick").classed("chart-y-axis-label", true))
            .lower()
          .append("text")
            .attr("transform", "rotate(-90)")
            .attr("y", -45)
            .attr("x", -height / 2)
            .attr("class", "chart-yaxis")
            .text(decodeURIComponent('%D0%A2%D0%B5%D0%BC%D0%BF%D0%B5%D1%80%D0%B0%D1%82%D1%83%D1%80%D0%B0%2C%20%C2%B0%D0%A1'));
          // y axis
        }

        function removeAxis(){
          svg.select(".x-axis").remove();
          svg.select(".y-axis").remove();
          svg.selectAll(".tick-line").remove();
        }

        function setBarAxis(data){
          const timeRange = getTimeRange(data);
          y = d3.scaleTime()
            .domain(d3.extent(data, d => d.date))
            .range([reverse_axis_left, height]); 
          
          svg.append("g")
            .attr("transform", `translate(5,0)`) 
            .attr("class", "y-axis")
            .call(d3.axisLeft(y).ticks(5).tickFormat(d => customTickFormat(d, timeRange)).tickSizeOuter(0))
            .call(g => g.selectAll(".domain, .tick").classed("chart-y-axis-label", true))
            .lower()
          .append("text")
            .attr("transform", "rotate(-90)")
            .attr("y", -50) 
            .attr("x", -height / 2)
            .attr("class", "chart-xaxis")
            .text(decodeURIComponent('%D0%92%D1%80%D0%B5%D0%BC%D1%8F%2C%20%D1%87'));
          if(timeRange <= 10 * 60 * 1000){
            d3.selectAll(".chart-y-axis-label").style("font-size","9px");
          }
          const xminValue = Math.min(d3.min(data, d => d.value),0);
          const xmaxValue = Math.max(d3.max(data, d => d.value),0);

          x = d3.scaleLinear()
            .domain([25, 60])
            .range([0, width]);

          const xTicksText = setBarXTicks(x);

          svg.append("g")
            .attr("transform", `translate(5,${height})`) 
            .attr("class", "x-axis")
            .call(xTicksText)
            .call(g => g.selectAll(".domain, .tick line").remove())
            .call(g => g.selectAll(".domain, .tick").classed("chart-x-axis-label", true))
            .lower()
          .append("text")
            .attr("y", 35) 
            .attr("x", width / 2)
            .attr("class", "chart-yaxis")
            .text(decodeURIComponent('%D0%A2%D0%B5%D0%BC%D0%BF%D0%B5%D1%80%D0%B0%D1%82%D1%83%D1%80%D0%B0%2C%20%C2%B0%D0%A1'));
        }

        function setColumnAxis(data){
          const timeRange = getTimeRange(data);
          x = d3.scaleTime()
          .domain(d3.extent(data, d => d.date))
          .range([0, width]);

          svg.append("g")
            .attr("transform", `translate(0,${height})`)
            .attr("class", "x-axis")
            .call(d3.axisBottom(x).ticks(4).tickFormat(d => customTickFormat(d, timeRange)).tickSizeOuter(0))
            .call(g => g.selectAll(".domain, .tick").classed("chart-x-axis-label", true))
            .lower()
          .append("text")
            .attr("y", margin.bottom *2 / 3)
            .attr("x", width / 2)
            .attr("class", "chart-xaxis")
            .text(decodeURIComponent('%D0%92%D1%80%D0%B5%D0%BC%D1%8F%2C%20%D1%87'));
          // x axis

          const yminValue = Math.min(d3.min(data, d => d.value),0);
          const ymaxValue = Math.max(d3.max(data, d => d.value),0);
          y = d3.scaleLinear()
            .domain([25,60 ])
            .range([height, 0]);
          const yTicksText = setLineAndColumnYTicks(y);
          

          svg.append("g")
            .attr("class", "y-axis")
            .call(yTicksText)
            .call(g => g.selectAll(".domain, .tick line").remove())
            .call(g => g.selectAll(".domain, .tick").classed("chart-y-axis-label", true))
            .lower()
          .append("text")
            .attr("transform", "rotate(-90)")
            .attr("y", -45)
            .attr("x", -height / 2)
            .attr("class", "chart-yaxis")
            .text(decodeURIComponent('%D0%A2%D0%B5%D0%BC%D0%BF%D0%B5%D1%80%D0%B0%D1%82%D1%83%D1%80%D0%B0%2C%20%C2%B0%D0%A1'));
          // y axis
        }

        // add interactive tooltip
        const tooltip = d3.select("#chart-container")
          .append("div")
          .style("opacity", 0)
          .attr("class", "tooltip chart-tooltip");
        

        function mouseover(type) {
          return function (event, d) {
                tooltip.transition()
                  .duration(200)
                  .style("opacity", 0.8);
                
                let originalDate = new Date(d.date);
                let tooltipString = response.channel.field3;
                tooltipString = xssEvasion.sanitizeResponse(tooltipString);
                tooltip.html(
                    tooltipString + `: <b>${d.value}</b><br>` +
                    `${originalDate.toDateString()}<br>`+
                    `${originalDate.toTimeString().replace(/\(.*\)/, "")}` 
                  )
                  .style("left", calculatePosX(event.pageX) + "px") 
                  .style("top", calculatePosY(event.pageY) + "px")
                  .style("opacity", 0.8)
                  .style("visibility", "visible")
                  .style("position","absolute");
                  if (type=="column" || type=="bar"){
                    const brightColor = d3.color('#d62020').brighter();
                    d3.select(this).attr("fill", brightColor);
                  } else {
                    d3.select(this).attr("stroke", 'white');
                  }
                  d3.select(this).attr("r", "5");
              } 
        } 

        function mouseleave(d){
          tooltip
            .transition()
            .duration(500)
            .style("opacity", 0)
          tooltip
            .transition()
